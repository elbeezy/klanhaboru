<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>SZEM4 kinézet-előnézet</title>
<style>
	/* Only the badge belongs to the preview itself. Everything else on the page
	   is styled by the real stylesheet, pulled out of scripts/SZEM4.js below. */
	#preview_badge {
		position: fixed; top: 0; left: 0; z-index: 9999;
		font: 11px/1.6 monospace; background: #b00; color: #fff;
		padding: 2px 8px; opacity: 0.85;
	}
	/* Preview-only: the real interface hides every panel and reveals one at a
	   time through nyit(). Here they are all shown at once, stacked, so the
	   whole thing can be looked at in one pass. */
	body #content table.menuitem { display: table !important; }
	#preview_error {
		font: 14px/1.6 monospace; color: #c00; background: #fee;
		padding: 12px; margin: 40px auto; max-width: 900px; white-space: pre-wrap;
	}
	/* Preview-only: the interface holds one capacity reading at a time, the one
	   his counters currently produce. All of them are shown here at once, each
	   under a label naming the reading the real code gave that fixture. */
	.preview_valtozat {
		font: 11px/2 monospace; color: #b00; text-transform: uppercase;
		letter-spacing: 0.08em; padding: 6px 0 0;
	}
</style>
</head>
<body>
<div id="preview_badge">ELŐNÉZET — nem a valódi SZEM, csak a kinézete. Itt minden lap egyszerre látszik; a játékban egyszerre csak egy.</div>
<div id="preview_root"></div>

<script>
/* ---------------------------------------------------------------------------
   A look at SZEM's interface without a game page.

   init() gives up unless it is running on a real Klánháború screen, so none of
   the panels ever get built and the styling cannot be seen while working on it.
   This page pulls the real stylesheet out of scripts/SZEM4.js -- the actual
   text, not a copy that can drift -- and puts a representative slice of the
   interface underneath it: the header and module bar, a data table with the
   widest content it ever holds, the log, a form, and the message box.

   Open it the same way as the tests: tests/run.cmd, then /tests/preview.html.
   Change the CSS in SZEM4.js, press F5, see it.
--------------------------------------------------------------------------- */

const PIC = 'https://raw.githubusercontent.com/cncDAni2/klanhaboru/main/images/szem4/';

function hiba(msg) {
	document.getElementById('preview_root').innerHTML =
		'<div id="preview_error">' + msg + '</div>';
}

/* The stylesheet as the script really holds it: everything between
   `const szemStyle = ` and the backtick that closes it. */
function styleLapBol(src) {
	const marker = 'const szemStyle = `';
	const start = src.indexOf(marker);
	if (start === -1) throw new Error('nem találom a szemStyle blokkot a SZEM4.js-ben');
	const end = src.indexOf('`', start + marker.length);
	if (end === -1) throw new Error('a szemStyle blokk nincs lezárva');
	return src.slice(start + marker.length, end);
}

/* The real modulIkon(), cut out of the script and used as-is, so the buttons
   here are the same drawing the interface makes rather than a lookalike. */
let modulIkon = null;
let stopIkon = null;
let szemIkon = null;

/* The real drawing functions, cut out of the script and run as they are, so
   every icon here is the one the interface actually makes. They call each
   other, so they are compiled together in one scope rather than one by one. */
function fuggvenyKivag(src, nev) {
	const start = src.indexOf('function ' + nev + '(');
	if (start === -1) throw new Error('nem találom a ' + nev + ' függvényt');
	const end = src.indexOf('\n}', start);
	if (end === -1) throw new Error('a ' + nev + ' függvény nincs lezárva');
	return src.slice(start, end + 2);
}

function modulIkonBetolt(src) {
	const nevek = ['ikonSzin', 'ikonSvg', 'szemIkon', 'stopIkon', 'modulIkon'];
	const kod = nevek.map(function (n) { return fuggvenyKivag(src, n); }).join('\n\n');
	const api = new Function(kod + '\nreturn { szemIkon: szemIkon, stopIkon: stopIkon, modulIkon: modulIkon };')();
	szemIkon = api.szemIkon;
	stopIkon = api.stopIkon;
	modulIkon = api.modulIkon;
}

/* The Farmoló panel's markup carries the capacity row as an empty div: it is
   filled at runtime by farmStatKiir(), off counters that only exist once real
   farm reports have been analysed. So the one part of that panel the preview
   could never show was the row itself. The real reading functions are compiled
   here and run against made-up counters, exactly as with the icons -- no
   markup is retyped, so nothing can drift.

   The thresholds live in the same block as the sentences they choose between,
   which is why they are taken as one slice rather than named one by one. */
function allandokKivag(src) {
	const start = src.indexOf('var STAT_MIN_MINTA');
	if (start === -1) throw new Error('nem találom a STAT küszöböket');
	const end = src.indexOf('\n};', start);
	if (end === -1) throw new Error('a STAT_SZOVEG blokk nincs lezárva');
	return src.slice(start, end + 3);
}

function farmStatBetolt(src) {
	const nevek = ['farmStatErtekeles', 'farmStatEgysegKiir', 'farmStatKiir'];
	const kod = allandokKivag(src) + '\n\n' +
		nevek.map(function (n) { return fuggvenyKivag(src, n); }).join('\n\n');
	/* farmStatKiir() reads the counters off SZEM4_FARM and paints into
	   #farm_kapacitas by id, so the fixture is handed to it the way the real
	   save does: by being what SZEM4_FARM holds when it runs. Declared inside
	   the compiled scope rather than passed in, so the real code's own reads
	   and writes land on the same object. */
	const api = new Function(
		'var SZEM4_FARM = { STAT: null };\n' + kod + '\n' +
		'return { fest: function (stat) { SZEM4_FARM.STAT = stat; farmStatKiir(); },' +
		'         ertekel: farmStatErtekeles };')();

	return {
		/* Returns what was painted, so a reading can be lifted out and shown
		   beside the others. The recommended army is drawn with the game's own
		   unit art, asked for by root-relative path like the rest of the panel. */
		fest: function (stat) {
			api.fest(stat);
			const el = document.getElementById('farm_kapacitas');
			el.innerHTML = el.innerHTML.replace(/src="\/graphic\//g, 'src="' + GAME_ASSET);
			return el.innerHTML;
		},
		ertekel: api.ertekel
	};
}

/* One set of counters per reading the panel can give. The numbers are chosen
   to sit either side of the real thresholds, but no fixture is labelled by
   hand: each label is the verdict the real code returns for it, so a changed
   threshold shows up as a relabelled row rather than as a quiet lie. */
const STAT_MINTAK = [
	null,
	{ jelentes: 8,  jelTeher: 3200,  zsakmany: 1900,  tele: 1,  kuldes: 12, minsereg: 0, keves: 0,
	  pop: 160,  popMinta: 8,  u_light: 40 },
	{ jelentes: 40, jelTeher: 24000, zsakmany: 10200, tele: 2,  kuldes: 60, minsereg: 3, keves: 0,
	  pop: 1200, popMinta: 40, u_light: 200, u_axe: 400 },
	{ jelentes: 40, jelTeher: 16000, zsakmany: 12800, tele: 18, kuldes: 55, minsereg: 2, keves: 1,
	  pop: 800,  popMinta: 40, u_light: 200 },
	{ jelentes: 40, jelTeher: 16000, zsakmany: 9600,  tele: 4,  kuldes: 50, minsereg: 2, keves: 12,
	  pop: 800,  popMinta: 40, u_light: 200 },
	{ jelentes: 40, jelTeher: 16000, zsakmany: 10400, tele: 5,  kuldes: 60, minsereg: 4, keves: 2,
	  pop: 800,  popMinta: 40, u_light: 200 }
];

/* The first reading stays in the real div, where the panel really puts it;
   the rest are appended into the same cell so they inherit the same box. */
function kapacitasSorok(api) {
	const el = document.getElementById('farm_kapacitas');
	if (!el) throw new Error('a farm panelben nincs #farm_kapacitas sor');
	const szulo = el.parentNode;
	const tobbi = STAT_MINTAK.slice(1).map(function (stat) {
		return { szint: api.ertekel(stat).szint, html: api.fest(stat) };
	});
	api.fest(STAT_MINTAK[0]);
	tobbi.forEach(function (v) {
		const cimke = document.createElement('div');
		cimke.className = 'preview_valtozat';
		cimke.textContent = 'előnézet — „' + v.szint + '” olvasat';
		szulo.appendChild(cimke);
		const sor = document.createElement('div');
		sor.className = 'szem4_kapacitas';
		sor.innerHTML = v.html;
		szulo.appendChild(sor);
	});
}

function modul(id, nev, all) {
	return '<img name="' + id + '" src="' + modulIkon(all) + '" ' +
		'alt="Stop" title="Klikk a szüneteltetéshez"> ' +
		'<a href="javascript:void 0">' + nev.toUpperCase() + '</a> ';
}

/* The Bányák cell exactly as banyakCella() builds it: the game's own building
   icon in front of each mine level, with real commas between them that carry
   no size, because addWagons() reads this cell's text back. The preview used
   to invent fa.png/agyag.png/vas.png here -- images that have never existed in
   the repository, so it showed three broken-image glyphs and flattered nothing. */
const BUILDING = 'https://dshu.innogamescdn.com/asset/88651122/graphic/buildings/mid/';

function banyak(fa, agyag, vas) {
	return [['wood', fa], ['stone', agyag], ['iron', vas]].map(function (r, i) {
		return (i ? '<span class="szem4_banya_vesszo">,</span>' : '') +
			'<span class="szem4_banya"><img src="' + BUILDING + r[0] + '3.png">' + r[1] + '</span>';
	}).join('');
}

/* The Farmoló panel, built from the markup the script really carries.

   The hand-written stand-in that used to be here only showed the target
   table, so the settings block, the unit picker and the two "add a village"
   forms were never looked at while the interface was being restyled -- and
   they were the parts still wearing the game's own colours.

   ujkieg("farm", ...) is handed a template literal. It has no nested
   backticks and only three interpolations, all of them image helpers, so it
   can be read out of the source and filled in here. Nothing is retyped, so
   nothing can drift.

   The game's own graphics are asked for with root-relative paths, which
   resolve on the game's domain and not here, so they are pointed at the CDN
   the script already uses for building icons. */
const GAME_ASSET = 'https://dshu.innogamescdn.com/asset/88651122/graphic/';
const UNITS = ['spear', 'sword', 'axe', 'archer', 'spy', 'light', 'marcher', 'heavy'];

function farmPanelBol(src) {
	const marker = 'ujkieg("farm","Farmoló",`';
	const start = src.indexOf(marker);
	if (start === -1) throw new Error('nem találom a farm panel markupját');
	const end = src.indexOf('`', start + marker.length);
	if (end === -1) throw new Error('a farm panel markup nincs lezárva');
	const sablon = src.slice(start + marker.length, end);

	const pic = (f) => PIC + f;
	const picBuilding = (b) => '<img src="' + GAME_ASSET + 'buildings/mid/' + b + '3.png">';
	const rovidit = () => UNITS.map((u, i) =>
		'<div class="szem4_unitbox" data-allunit="999" name="' + u + '"><label>' +
		'<img src="' + GAME_ASSET + 'unit/unit_' + u + '.png">' +
		'<input type="checkbox" name="' + u + '">' +
		'</label></div>').join('');

	const kitoltve = new Function('pic', 'picBuilding', 'rovidit', 'szemIkon',
		'return `' + sablon + '`;')(pic, picBuilding, rovidit, szemIkon);

	/* Root-relative game art, which only resolves on the game's own domain. */
	return kitoltve.replace(/src="\/graphic\//g, 'src="' + GAME_ASSET);
}

function farmSor(hova, banyak, fal, nyers, jatekos, tav) {
	return '<tr>' +
		'<td>' + hova + '</td>' +
		'<td>' + banyak + '</td>' +
		'<td>' + fal + '</td>' +
		'<td>' + nyers + '</td>' +
		'<td><input type="checkbox"' + (jatekos ? ' checked' : '') + '></td>' +
		/* What addWagons() actually puts here: one of four wagon pictures per
		   attack on its way in, picked by how much it is bringing back. The
		   preview used upstream's locomotive instead, at a size and colour
		   this column never has, so the widest cell in the table was the one
		   place the preview was not showing the interface.

		   The old filename is deliberately not spelled out anywhere on this
		   page: a test asserts it has gone, and a plain search cannot tell a
		   comment mentioning it from a call still making it. */
		'<td>' + ['wagon_normal', 'wagon_coal', 'wagon_empty'].map(function (w) {
			return '<img src="' + PIC + w + '.png?v=4" title="' + w + '" width="40px">';
		}).join(' ') + '</td>' +
		'<td>' + tav + '</td>' +
		'</tr>';
}

function tartalom(src) {
	const modulok =
		'<img src="' + PIC + 'kh_logo.png" alt="Game" title="Klánháború">' +
		'<a href="javascript:void 0" id="szunet_mind" title="Minden modul megállítása">' +
			'<img src="' + stopIkon() + '" alt="Szünet mind"><span id="szunet_mind_ido"></span></a>' +
		'<span class="menubar_valaszto"></span>' +
		modul('farm', 'Farmoló', true) +
		modul('vije', 'Jelentés elemző', true) +
		modul('idtamad', 'Bejövő támadások', false) +
		modul('epit', 'Építő', true) +
		modul('gyujto', 'Gyűjtő', false) +
		modul('adatok', 'Adatmentő', false);

	const farmSorok = [
		farmSor('500|500', banyak(3, 3, 2), '0', '1.240', false, '4.2'),
		farmSor('501|498', '&nbsp;', '-2', '860', false, '5.0'),
		farmSor('497|512', banyak(12, 10, 11), '5', '12.500', true, '11.8'),
		farmSor('488|530', '&nbsp;', '3', '', false, '24.3')
	].join('');

	return '' +
	'<div class="left-background"><video src="" autoplay loop muted></video></div>' +
	'<div class="right-background"><video src="" autoplay loop muted></video></div>' +

	'<div id="alert2" style="display:block">' +
		'<div id="alert2head">' +
			'<div>Üzenet</div>' +
			'<div><a href="javascript:void 0">[ESC] ❌</a></div>' +
		'</div>' +
		'<p id="alert2szov">Példaüzenet, hogy a doboz kinézete is látszódjon.</p>' +
	'</div>' +

	'<div class="fej">' +
		'<div id="global_notifications"></div>' +
		'<table width="100%" align="center">' +
			'<tr>' +
				'<td width="70%" id="fejresz" style="vertical-align:middle; margin:auto;"><h1>Szem <b>IV</b><i>Klánháború</i></h1></td>' +
				'<td id="sugo">Ide kerül a súgó szövege, amikor egy vezérlő fölé viszed az egeret.</td>' +
			'</tr>' +
			'<tr><td colspan="2" id="menuk">' +
				'<div class="divrow menubar">' +
					'<span class="divcell" id="kiegs">' + modulok + '</span>' +
					'<span class="divcell menubar_jobb">' +
						'<a href="javascript:void 0">Napló</a> ' +
						'<a href="javascript:void 0">Debug</a> ' +
						'<a href="javascript:void 0"><img src="' + szemIkon('hang') + '" alt="hangok"></a>' +
					'</span>' +
				'</div>' +
			'</td></tr>' +
		'</table>' +
	'</div>' +

	'<div id="content">' +
		'<table class="menuitem" width="1024px" align="center" id="farm"><tbody>' +
			farmPanelBol(src) +
		'</tbody></table>' +

		'<table class="menuitem" width="1024px" align="center"><tbody><tr><td>' +
			'<h1 align="center">Farmoló — célpontok</h1>' +
			'<table class="vis" id="farm_hova" style="vertical-align:top; display:inline-block;"><tbody>' +
				'<tr>' +
					'<th style="cursor:pointer;">Hova</th>' +
					'<th>Bányák</th>' +
					'<th style="cursor:pointer;">Fal</th>' +
					'<th style="cursor:pointer;">Nyers</th>' +
					'<th>J?</th>' +
					'<th style="height:20px; vertical-align:middle;">Szerelvények' +
						'<span style="position:absolute; right:7px; top:3px; display:flex; align-items:center;">' +
							'<img src="' + szemIkon('search', '--szem-on-accent') + '" alt="?" style="width:15px;height:15px;">' +
							'<input type="checkbox">' +
						'</span>' +
					'</th>' +
					'<th style="cursor:pointer;">Táv</th>' +
				'</tr>' +
				farmSorok +
			'</tbody></table>' +
		'</td></tr></tbody></table>' +

		'<table class="menuitem" width="1024px" align="center"><tbody><tr><td>' +
			'<h1 align="center">Napló</h1><br>' +
			'<table align="center" class="vis" id="naploka"><tbody>' +
				'<tr><th style="cursor:pointer;">Dátum</th><th style="cursor:pointer;">Script</th><th style="cursor:pointer;">Esemény</th></tr>' +
				'<tr><td>Sept 6, 20:43:05</td><td>Adat</td><td>Adatbetöltés helyi adatokból...</td></tr>' +
				'<tr><td>Sept 6, 20:43:04</td><td>Indulás</td><td>Kiegészítők szünetelő módban.</td></tr>' +
				'<tr><td>Sept 6, 20:43:04</td><td>Globál</td><td>Verzió [v4.8 by elbeezy] legfrissebb állapotban, GIT-ről szedve.</td></tr>' +
			'</tbody></table>' +
		'</td></tr></tbody></table>' +

		'<table class="menuitem" width="1024px" align="center"><tbody><tr><td>' +
			'<h1 align="center">Beállítások</h1>' +
			'<table class="vis style-settings-table" align="center"><tbody>' +
				'<tr><td>Bal háttérkép</td><td><input type="text" size="60" value="-"></td></tr>' +
				'<tr><td>Tükrözött?</td><td><input type="checkbox"></td></tr>' +
				'<tr><td>Szünet percben</td><td><input type="text" size="6" value="30"> <button type="button">Mentés</button></td></tr>' +
				'<tr><td>Csoport</td><td><select><option>Összes falu</option><option>Farmoló faluk</option></select></td></tr>' +
			'</tbody></table>' +
			'<br><textarea rows="3" cols="60">Építési sor: ANY(FASTEST(MINES 25)); barracks 5</textarea>' +
		'</td></tr></tbody></table>' +
	'</div>';
}

fetch('../scripts/SZEM4.js')
	.then(function (r) {
		if (!r.ok) throw new Error('scripts/SZEM4.js nem tölthető be (' + r.status + ')');
		return r.text();
	})
	.then(function (src) {
		const el = document.createElement('style');
		el.textContent = styleLapBol(src);
		document.head.appendChild(el);
		/* After the stylesheet is in: the icons read their colours off it. */
		modulIkonBetolt(src);
		document.getElementById('preview_root').innerHTML = tartalom(src);
		/* After the panel is on the page: the capacity row is painted into it
		   by id, so the div has to exist before the real code looks for it. */
		const statApi = farmStatBetolt(src);
		/* The clear control is the panel's own markup and is clickable here.
		   Clearing really does reset the counters and repaint, which is what
		   the empty reading looks like, so the preview does just that. */
		window.farmStatNullaz = function () { statApi.fest(null); };
		kapacitasSorok(statApi);
	})
	.catch(function (e) {
		hiba('Az előnézet nem tudott elindulni:\n\n' + e.message +
		     '\n\nA repó gyökeréből kell kiszolgálni (tests/run.cmd), file:// alól nem megy.');
	});
</script>
</body>
</html>
